openapi: 3.1.0
info:
  title: TravelGo Mobile API
  version: 1.1.0
  description: |
    Responses use camelCase keys. Show localized errors by error.code.
    Use the server-provided expiresIn and resendIn values for timers.
    Access tokens last 15 minutes. Refresh tokens are rotated on use, and each new refresh token lasts 60 days.
servers:
  - url: /v1
    description: Current deployment
  - url: https://travel-go-api.kossasoft.com/v1
    description: Staging for mobile integration
tags:
  - name: Authentication
  - name: Profile
  - name: Content
paths:
  /auth/register/start:
    post:
      tags: [Authentication]
      operationId: startRegistration
      summary: Request a registration code
      parameters:
        - $ref: '#/components/parameters/Language'
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/Challenge'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '409':
          description: PHONE_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: WEAK_PASSWORD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SmsUnavailable'
  /auth/register/verify:
    post:
      tags: [Authentication]
      operationId: verifyRegistration
      summary: Confirm a registration code and create an account
      requestBody:
        $ref: '#/components/requestBodies/VerificationCode'
      responses:
        '201':
          $ref: '#/components/responses/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/VerificationNotFound'
        '409':
          description: PHONE_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/RejectedCode'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/code/resend:
    post:
      tags: [Authentication]
      operationId: resendCode
      summary: Replace the previous SMS code on the same challenge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [verificationId]
              properties:
                verificationId:
                  $ref: '#/components/schemas/VerificationId'
      responses:
        '200':
          description: Updated expiration and resend timers in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CodeTiming'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/VerificationNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SmsUnavailable'
  /auth/login:
    post:
      tags: [Authentication]
      operationId: login
      summary: Sign in with a phone number and password
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          $ref: '#/components/responses/AuthenticatedSession'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: INVALID_CREDENTIALS for both an unknown number and an incorrect password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshSession
      summary: Replace both tokens using a single-use refresh token
      description: Serialize refresh requests on the client. The old access and refresh tokens cease to work when rotation succeeds.
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '200':
          description: New token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Revoke the session for the supplied refresh token
      requestBody:
        $ref: '#/components/requestBodies/RefreshToken'
      responses:
        '204':
          description: Session revoked or already absent
        '400':
          $ref: '#/components/responses/InvalidInput'
  /auth/password/forgot:
    post:
      tags: [Authentication]
      operationId: startPasswordRecovery
      summary: Request a password recovery code
      description: Returns the same response structure for registered and unknown phone numbers.
      parameters:
        - $ref: '#/components/parameters/Language'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone]
              properties:
                phone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '200':
          $ref: '#/components/responses/Challenge'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SmsUnavailable'
  /auth/password/verify:
    post:
      tags: [Authentication]
      operationId: verifyPasswordRecovery
      summary: Exchange a recovery code for a one-time reset token
      requestBody:
        $ref: '#/components/requestBodies/VerificationCode'
      responses:
        '200':
          description: One-time reset token valid for 15 minutes
          content:
            application/json:
              schema:
                type: object
                required: [resetToken, expiresIn]
                properties:
                  resetToken: { type: string }
                  expiresIn: { type: integer, example: 900 }
        '400':
          $ref: '#/components/responses/InvalidInput'
        '404':
          $ref: '#/components/responses/VerificationNotFound'
        '422':
          $ref: '#/components/responses/RejectedCode'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/password/reset:
    post:
      tags: [Authentication]
      operationId: resetPassword
      summary: Change the password and revoke all mobile sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resetToken, newPassword]
              properties:
                resetToken: { type: string, minLength: 1, maxLength: 128 }
                newPassword:
                  $ref: '#/components/schemas/NewPassword'
      responses:
        '204':
          description: Password changed
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          description: RESET_TOKEN_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: WEAK_PASSWORD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Read the signed-in user's profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [Profile]
      operationId: updateCurrentUser
      summary: Update the supplied personal details
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdate'
      responses:
        '200':
          $ref: '#/components/responses/CurrentProfile'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: INVALID_NAME or INVALID_DATE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Profile]
      operationId: deleteCurrentAccount
      summary: Delete the account, personal data and all sessions
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CurrentPassword'
      responses:
        '204':
          description: Account deleted and sessions revoked
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/ProfileUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/password/verify:
    post:
      tags: [Profile]
      operationId: verifyCurrentPassword
      summary: Check the current password
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/CurrentPassword'
      responses:
        '204':
          description: Password verified
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/ProfileUnauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/password:
    post:
      tags: [Profile]
      operationId: changeCurrentPassword
      summary: Update the account password and revoke other sessions
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, minLength: 1, maxLength: 72 }
                newPassword:
                  $ref: '#/components/schemas/NewPassword'
      responses:
        '204':
          description: Password changed, current session retained
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/ProfileUnauthorized'
        '422':
          description: WEAK_PASSWORD or SAME_PASSWORD
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/phone/start:
    post:
      tags: [Profile]
      operationId: startPhoneChange
      summary: Confirm the current password and request an SMS at the new number
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password, newPhone]
              properties:
                password: { type: string, minLength: 1, maxLength: 72 }
                newPhone:
                  $ref: '#/components/schemas/Phone'
      responses:
        '200':
          $ref: '#/components/responses/Challenge'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/ProfileUnauthorized'
        '409':
          description: PHONE_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: SAME_PHONE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/SmsUnavailable'
  /me/phone/verify:
    post:
      tags: [Profile]
      operationId: verifyPhoneChange
      summary: Confirm the new number and revoke other sessions
      security:
        - bearerAuth: []
      requestBody:
        $ref: '#/components/requestBodies/VerificationCode'
      responses:
        '200':
          $ref: '#/components/responses/CurrentProfile'
        '400':
          $ref: '#/components/responses/InvalidInput'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/VerificationNotFound'
        '409':
          description: PHONE_ALREADY_REGISTERED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/RejectedCode'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/avatar:
    post:
      tags: [Profile]
      operationId: uploadAvatar
      summary: Upload or replace the avatar
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: JPEG, PNG or WebP up to 5 MB and 16 megapixels.
      responses:
        '200':
          description: New avatar URL
          content:
            application/json:
              schema:
                type: object
                required: [avatarUrl]
                properties:
                  avatarUrl: { type: string, format: uri }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: FILE_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: INVALID_IMAGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags: [Profile]
      operationId: deleteAvatar
      summary: Delete the current avatar
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Avatar deleted or already absent
        '401':
          $ref: '#/components/responses/Unauthorized'
  /avatars/{user}/{avatar}/{size}.webp:
    parameters:
      - { in: path, name: user, required: true, schema: {type: string, format: uuid} }
      - { in: path, name: avatar, required: true, schema: {type: string, format: uuid} }
      - { in: path, name: size, required: true, schema: {type: integer, enum: [256, 512]} }
    get:
      tags: [Profile]
      operationId: readAvatar
      summary: Read one active avatar size at the URL returned by the profile
      responses:
        '200':
          description: Avatar without original image metadata
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404':
          description: Avatar absent, deleted or replaced
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /geo/locate:
    get:
      tags:
        - Content
      operationId: locateCatalogCity
      summary: Locate the published city, region and country
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
      description: Coordinates are rounded to three decimal places for calculations and are not saved in server logs or
        the database.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeoLocation'
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=120
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /places/nearby:
    get:
      tags:
        - Content
      operationId: listNearbyPlaces
      summary: Find nearby published places
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: maxKm
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 1000
          description: Comma-separated place categories.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1536
          description: Opaque cursor from the preceding page with the same coordinates and filters.
      description: Coordinates are rounded to three decimal places for calculations and are not saved in server logs or
        the database.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyPlaces'
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=120
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /places/in-area:
    get:
      tags:
        - Content
      operationId: listCatalogMarkers
      summary: Get markers in a map viewport
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: minLat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: minLng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: maxLat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: maxLng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: category
          in: query
          required: false
          schema:
            type: string
            maxLength: 1000
          description: Comma-separated place categories.
      description: Coordinates are rounded to three decimal places for calculations and are not saved in server logs or
        the database.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogMarker'
                maxItems: 200
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=120
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /places/{id}:
    get:
      tags:
        - Content
      operationId: getCatalogPlace
      summary: Read a published place
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CatalogId'
        - name: lat
          in: query
          required: false
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: false
          schema:
            type: number
            minimum: -180
            maximum: 180
      description: Coordinates are rounded to three decimal places for calculations and are not saved in server logs or
        the database.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogPlaceDetails'
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=300
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: NOT_FOUND for missing or unpublished content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /routes/nearby:
    get:
      tags:
        - Content
      operationId: listNearbyRoutes
      summary: Get local and nearby routes
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: lat
          in: query
          required: true
          schema:
            type: number
            minimum: -90
            maximum: 90
        - name: lng
          in: query
          required: true
          schema:
            type: number
            minimum: -180
            maximum: 180
        - name: maxKm
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 150
        - name: transport
          in: query
          required: false
          schema:
            type: string
            enum:
              - walk
              - car
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1536
          description: Opaque cursor from the preceding page with the same coordinates and filters.
      description: Coordinates are rounded to three decimal places for calculations and are not saved in server logs or
        the database.
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NearbyRoutes'
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=120
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /routes/{id}:
    get:
      tags:
        - Content
      operationId: getCatalogRoute
      summary: Read a published route
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CatalogId'
      security:
        - {}
        - bearerAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRouteDetails'
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=300
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: NOT_FOUND for missing or unpublished content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /cities:
    get:
      tags:
        - Content
      operationId: listCatalogCities
      summary: List published cities with visible routes
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CatalogCity'
          headers:
            ETag:
              schema:
                type: string
            Cache-Control:
              schema:
                type: string
                example: private, max-age=300
        '304':
          description: Content unchanged
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimited'
  /catalog-media/{id}/{type}/{image}/{size}.webp:
    get:
      tags:
        - Content
      operationId: getCatalogMedia
      summary: Read an image referenced by a visible catalog item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum:
              - cities
              - places
              - routes
        - name: image
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: size
          in: path
          required: true
          schema:
            type: integer
            enum:
              - 400
              - 1200
      responses:
        '200':
          description: WebP content
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '404':
          description: NOT_FOUND for missing or unpublished content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /me/saved-routes:
    get:
      tags:
        - Content
      operationId: listSavedRoutes
      summary: List the signed-in user’s saved routes
      security:
        - bearerAuth: []
      parameters:
        - name: Accept-Language
          in: query
          required: false
          schema:
            type: string
            example: uk
          description: Preferred content language. Missing translations fall back to English.
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 1536
          description: Opaque cursor from the preceding page with the same coordinates and filters.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRoutesPage'
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/saved-routes/{id}:
    put:
      tags:
        - Content
      operationId: saveCatalogRoute
      summary: Save a published route
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CatalogId'
      responses:
        '204':
          description: Bookmark change applied
        '404':
          description: NOT_FOUND for missing or unpublished content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
    delete:
      tags:
        - Content
      operationId: removeSavedRoute
      summary: Remove a saved route
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: '#/components/schemas/CatalogId'
      responses:
        '204':
          description: Bookmark change applied
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
  /me/saved-routes/import:
    post:
      tags:
        - Content
      operationId: importSavedRoutes
      summary: Import bookmarks from the device by slug or UUID
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SavedRouteImport'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SavedRouteImportResult'
        '400':
          description: INVALID_COORDINATES, INVALID_CURSOR or VALIDATION_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Opaque access token returned by the authentication endpoints.
  parameters:
    Language:
      in: header
      name: Accept-Language
      schema: { type: string, example: uk }
      description: Preferred language (uk, en, de, es, fr). Defaults to uk.
  requestBodies:
    CurrentPassword:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [password]
            properties:
              password: { type: string, minLength: 1, maxLength: 72 }
    Credentials:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [phone, password]
            properties:
              phone:
                $ref: '#/components/schemas/Phone'
              password:
                type: string
                minLength: 1
                maxLength: 72
                description: Registration requires at least 8 characters. Passwords use at most 72 bytes.
    VerificationCode:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [verificationId, code]
            properties:
              verificationId:
                $ref: '#/components/schemas/VerificationId'
              code:
                type: string
                pattern: '^[0-9]{4}$'
                example: '0123'
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            required: [refreshToken]
            properties:
              refreshToken: { type: string, minLength: 1, maxLength: 128 }
  responses:
    CurrentProfile:
      description: Updated account profile
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/User'
    ProfileUnauthorized:
      description: WRONG_PASSWORD, UNAUTHORIZED or TOKEN_EXPIRED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AuthenticatedSession:
      description: Token pair and authenticated profile
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/TokenPair'
              - type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
    Challenge:
      description: Verification challenge
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/CodeTiming'
              - type: object
                required: [verificationId, codeLength]
                properties:
                  verificationId:
                    $ref: '#/components/schemas/VerificationId'
                  codeLength: { type: integer, const: 4 }
    InvalidInput:
      description: VALIDATION_ERROR or INVALID_PHONE
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RejectedCode:
      description: WRONG_CODE or CODE_EXPIRED. WRONG_CODE includes details.attemptsLeft.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    VerificationNotFound:
      description: VERIFICATION_NOT_FOUND for missing or consumed challenges
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: UNAUTHORIZED or TOKEN_EXPIRED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SmsUnavailable:
      description: SMS_UNAVAILABLE when verification delivery is disabled outside of test environments
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    RateLimited:
      description: RATE_LIMITED, RESEND_TOO_EARLY or TOO_MANY_ATTEMPTS
      headers:
        Retry-After:
          description: Seconds before retry. Present for RATE_LIMITED and RESEND_TOO_EARLY.
          schema: { type: integer }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ProfileUpdate:
      type: object
      properties:
        firstName: { type: string, minLength: 1, maxLength: 50 }
        lastName: { type: string, minLength: 1, maxLength: 50 }
        middleName: { type: [string, 'null'], maxLength: 50 }
        birthDate: { type: [string, 'null'], format: date }
        language: { type: string, enum: [uk, en, de, es, fr] }
    Phone:
      type: string
      pattern: '^\+[1-9][0-9]{6,14}$'
      example: '+12025550147'
    NewPassword:
      type: string
      minLength: 8
      maxLength: 72
      description: Use at most 72 bytes.
    VerificationId:
      type: string
      format: uuid
    CodeTiming:
      type: object
      required: [expiresIn, resendIn]
      properties:
        expiresIn: { type: integer, example: 600 }
        resendIn: { type: integer, example: 45 }
    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
    User:
      type: object
      required: [id, phone, firstName, lastName, middleName, birthDate, avatarUrl, language, plan, planUntil, createdAt]
      properties:
        id: { type: string, format: uuid }
        phone:
          $ref: '#/components/schemas/Phone'
        firstName: { type: [string, 'null'] }
        lastName: { type: [string, 'null'] }
        middleName: { type: [string, 'null'] }
        birthDate: { type: [string, 'null'], format: date }
        avatarUrl: { type: [string, 'null'], format: uri }
        language: { type: string, enum: [uk, en, de, es, fr] }
        plan: { type: string, enum: [free, pro] }
        planUntil: { type: [string, 'null'], format: date }
        createdAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code: { type: string }
            message: { type: string }
            field: { type: string }
            details:
              type: object
              properties:
                retryAfter: { type: integer }
                attemptsLeft: { type: integer }
    CatalogId:
      type: string
      maxLength: 160
      pattern: ^[A-Za-z0-9]+(?:-[A-Za-z0-9]+)*$
      description: Stable content slug or UUID. Imported records are returned by their original slugs.
    CatalogCityRef:
      type: object
      required:
        - id
        - name
      properties:
        id:
          $ref: '#/components/schemas/CatalogId'
        name:
          type: string
    CatalogCountryRef:
      type: object
      required:
        - code
        - name
      properties:
        code:
          type: string
          pattern: ^[A-Z]{2}$
        name:
          type: string
    CatalogCity:
      type: object
      required:
        - id
        - name
        - country
        - latitude
        - longitude
        - routesCount
      properties:
        id:
          $ref: '#/components/schemas/CatalogId'
        name:
          type: string
        country:
          $ref: '#/components/schemas/CatalogCountryRef'
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        routesCount:
          type: integer
          minimum: 0
    GeoLocation:
      type: object
      required:
        - city
        - region
        - country
      properties:
        city:
          anyOf:
            - type: object
              required:
                - id
                - name
                - distanceKm
                - timeZone
              properties:
                id:
                  $ref: '#/components/schemas/CatalogId'
                name:
                  type: string
                distanceKm:
                  type: number
                timeZone:
                  type: string
            - type: 'null'
        region:
          anyOf:
            - $ref: '#/components/schemas/CatalogCityRef'
            - type: 'null'
        country:
          anyOf:
            - $ref: '#/components/schemas/CatalogCountryRef'
            - type: 'null'
    CatalogMarker:
      type: object
      required:
        - id
        - name
        - category
        - latitude
        - longitude
        - priority
      properties:
        id:
          $ref: '#/components/schemas/CatalogId'
        name:
          type: string
        category:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        priority:
          type: integer
          minimum: 1
          maximum: 5
    CatalogHours:
      anyOf:
        - oneOf:
            - const: always
            - type: object
              required:
                - open
                - close
              properties:
                open:
                  type: string
                  pattern: ^[0-9]{2}:[0-9]{2}$
                close:
                  type: string
                  pattern: ^[0-9]{2}:[0-9]{2}$
                closedOn:
                  type: array
                  items:
                    type: integer
                    minimum: 0
                    maximum: 6
                  uniqueItems: true
                  maxItems: 7
        - type: 'null'
    CatalogImage:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          format: uri
        credit:
          type: string
    CatalogPlaceCard:
      type: object
      required:
        - id
        - name
        - category
        - shortDescription
        - address
        - latitude
        - longitude
        - distanceKm
        - image
        - hours
        - timeZone
        - city
        - routesCount
      properties:
        id:
          $ref: '#/components/schemas/CatalogId'
        name:
          type: string
        category:
          type: string
        shortDescription:
          type: string
        address:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        distanceKm:
          type:
            - number
            - 'null'
        image:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
        hours:
          $ref: '#/components/schemas/CatalogHours'
        timeZone:
          type: string
        city:
          $ref: '#/components/schemas/CatalogCityRef'
        routesCount:
          type: integer
          minimum: 0
    CatalogPlaceDetails:
      allOf:
        - $ref: '#/components/schemas/CatalogPlaceCard'
        - type: object
          required:
            - description
            - history
            - facts
            - images
            - website
            - visitMinutes
            - wiki
            - routes
          properties:
            description:
              type: array
              items:
                type: string
            history:
              type: array
              items:
                type: string
            facts:
              type: array
              items:
                type: string
            images:
              type: array
              items:
                $ref: '#/components/schemas/CatalogImage'
            website:
              anyOf:
                - type: string
                  format: uri
                - type: 'null'
            visitMinutes:
              type: integer
              minimum: 0
            wiki:
              type:
                - string
                - 'null'
            routes:
              type: array
              items:
                $ref: '#/components/schemas/CatalogRouteCard'
    CatalogPoint:
      type: object
      required:
        - name
        - latitude
        - longitude
      properties:
        name:
          type: string
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        placeId:
          $ref: '#/components/schemas/CatalogId'
    CatalogRouteCard:
      type: object
      required:
        - id
        - title
        - description
        - coverImage
        - coverCredit
        - city
        - country
        - region
        - durationMinutes
        - distanceKm
        - placesCount
        - badge
        - rating
        - reviewsCount
        - usedCount
        - travelersCount
        - isOfficial
        - transport
        - source
        - start
        - isSaved
      properties:
        id:
          $ref: '#/components/schemas/CatalogId'
        title:
          type: string
        description:
          type: string
        coverImage:
          anyOf:
            - type: string
              format: uri
            - type: 'null'
        coverCredit:
          type:
            - string
            - 'null'
        city:
          $ref: '#/components/schemas/CatalogCityRef'
        country:
          $ref: '#/components/schemas/CatalogCountryRef'
        region:
          anyOf:
            - $ref: '#/components/schemas/CatalogCityRef'
            - type: 'null'
        durationMinutes:
          type: integer
          minimum: 0
        distanceKm:
          type: number
        placesCount:
          type: integer
          minimum: 0
        badge:
          type:
            - string
            - 'null'
        rating:
          type:
            - number
            - 'null'
        reviewsCount:
          type: integer
          minimum: 0
        usedCount:
          type: integer
          minimum: 0
        travelersCount:
          type: integer
          minimum: 0
        isOfficial:
          type: boolean
        transport:
          type: string
          enum:
            - walk
            - car
        source:
          type: object
          required:
            - kind
          properties:
            kind:
              type: string
              enum:
                - travelgo
                - guide
                - user
        start:
          $ref: '#/components/schemas/CatalogPoint'
        isSaved:
          type: boolean
    CatalogStop:
      type: object
      required:
        - position
        - visitMinutes
        - note
        - place
      properties:
        position:
          type: integer
          minimum: 0
        visitMinutes:
          type: integer
          minimum: 0
        note:
          type:
            - string
            - 'null'
        place:
          type: object
          required:
            - id
            - name
            - description
            - address
            - latitude
            - longitude
            - hours
            - images
            - wiki
          properties:
            id:
              $ref: '#/components/schemas/CatalogId'
            name:
              type: string
            description:
              type: string
            address:
              type: string
            latitude:
              type: number
              minimum: -90
              maximum: 90
            longitude:
              type: number
              minimum: -180
              maximum: 180
            hours:
              $ref: '#/components/schemas/CatalogHours'
            images:
              type: array
              items:
                type: string
                format: uri
            wiki:
              type:
                - string
                - 'null'
    CatalogLineString:
      type: object
      required:
        - type
        - coordinates
      properties:
        type:
          const: LineString
        coordinates:
          type: array
          items:
            type: array
            items:
              type: number
            minItems: 2
            maxItems: 2
          minItems: 2
    CatalogRouteDetails:
      allOf:
        - $ref: '#/components/schemas/CatalogRouteCard'
        - type: object
          required:
            - about
            - timeZone
            - stops
            - end
            - isLoop
            - path
          properties:
            about:
              type: array
              items:
                type: string
            timeZone:
              type: string
            stops:
              type: array
              items:
                $ref: '#/components/schemas/CatalogStop'
            end:
              $ref: '#/components/schemas/CatalogPoint'
            isLoop:
              type: boolean
            path:
              anyOf:
                - $ref: '#/components/schemas/CatalogLineString'
                - type: 'null'
    NearbyPlaces:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPlaceCard'
        nextCursor:
          type:
            - string
            - 'null'
    NearbyRoutes:
      type: object
      required:
        - city
        - items
        - nextCursor
        - suggestion
      properties:
        city:
          anyOf:
            - $ref: '#/components/schemas/CatalogCityRef'
            - type: 'null'
        items:
          type: array
          items:
            type: object
            required:
              - scope
              - distanceKm
              - route
            properties:
              scope:
                type: string
                enum:
                  - city
                  - nearby
              distanceKm:
                type: number
              route:
                $ref: '#/components/schemas/CatalogRouteCard'
        nextCursor:
          type:
            - string
            - 'null'
        suggestion:
          anyOf:
            - type: object
              required:
                - cities
              properties:
                cities:
                  type: array
                  items:
                    type: object
                    required:
                      - id
                      - name
                      - distanceKm
                      - routesCount
                      - latitude
                      - longitude
                    properties:
                      id:
                        $ref: '#/components/schemas/CatalogId'
                      name:
                        type: string
                      distanceKm:
                        type: number
                      routesCount:
                        type: integer
                        minimum: 0
                      latitude:
                        type: number
                        minimum: -90
                        maximum: 90
                      longitude:
                        type: number
                        minimum: -180
                        maximum: 180
            - type: 'null'
    SavedRoutesPage:
      type: object
      required:
        - items
        - nextCursor
      properties:
        items:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/CatalogRouteCard'
              - type: object
                required:
                  - id
                  - status
                properties:
                  id:
                    $ref: '#/components/schemas/CatalogId'
                  status:
                    type: string
                    enum:
                      - hidden
                      - archived
        nextCursor:
          type:
            - string
            - 'null'
    SavedRouteImport:
      type: object
      required:
        - routeIds
      properties:
        routeIds:
          type: array
          items:
            $ref: '#/components/schemas/CatalogId'
          maxItems: 100
    SavedRouteImportResult:
      type: object
      required:
        - savedIds
        - unavailableIds
      properties:
        savedIds:
          type: array
          items:
            $ref: '#/components/schemas/CatalogId'
        unavailableIds:
          type: array
          items:
            $ref: '#/components/schemas/CatalogId'
